services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daily-deals
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # .env 中出现的所有变量都会自动注入容器，新增后台变量无需再改本文件。
    # .env 中未出现或留空的变量，继续使用后台保存的值或代码默认值。
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    # 如宿主机存在 DNS 污染，可取消下面两行指定干净解析器。
    # dns:
    #   - 223.5.5.5
    #   - 119.29.29.29
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
